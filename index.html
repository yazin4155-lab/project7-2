<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>My Weather App</h1>

    <div class="card">
        <h2>Baghdad</h2>
        <p class="sun">☀️</p>
        <p>24°C and sunny</p>
    </div>

    <h2>Sample Weekly Forecast</h2>
    <p>Monday: 24°C</p>
    <p>Tuesday: 23°C</p>
    <p>Wednesday: 21°C</p>
    <p>Thursday: 19°C</p>
    <p>Friday: 20°C</p>
    <p>Saturday: 22°C</p>
    <p>Sunday: 24°C</p>
</body>
</html>
